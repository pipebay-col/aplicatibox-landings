<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AplicatiBox · Centro de Control Inteligente</title>
<style>
  :root {
    --bg:#0b0e14; --panel:#12161f; --panel2:#1a1f2b; --border:#232a38;
    --text:#e8ecf5; --muted:#7f889c;
    --indigo:#6366f1; --sky:#0ea5e9; --green:#10b981; --amber:#f59e0b;
    --red:#ef4444; --violet:#8b5cf6; --cyan:#22d3ee;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased; }
  #app { display:grid; grid-template-columns:180px 1fr; grid-template-rows:56px 1fr; height:100vh; height:100dvh; }

  .side { background:var(--panel); border-right:1px solid var(--border); grid-row:1/3; padding:14px 10px; overflow-y:auto; }
  .side .logo { display:flex; align-items:center; gap:10px; margin-bottom:16px; padding:0 6px; }
  .logo i { width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,var(--indigo),var(--sky));
    display:flex; align-items:center; justify-content:center; font-style:normal; font-weight:800; color:#fff; font-size:17px; flex-shrink:0; }
  .logo .brand { font-size:13px; font-weight:700; color:var(--text); line-height:1.2; }
  .logo .brand small { display:block; font-size:9px; color:var(--muted); font-weight:400; }
  .nav { display:flex; flex-direction:column; gap:3px; }
  .nav button { display:flex; align-items:center; gap:10px; width:100%; background:none; border:none;
    color:var(--muted); font-size:12px; padding:9px 12px; border-radius:9px; cursor:pointer; transition:.15s; text-align:left; }
  .nav button:hover { background:var(--panel2); color:var(--text); }
  .nav button.on { background:var(--panel2); color:var(--text); border-left:3px solid var(--indigo); padding-left:9px; }
  .nav button .icn { font-size:16px; line-height:1; flex-shrink:0; }
  .nav button .lbl { flex:1; }
  .nav button .n { font-size:9px; background:var(--indigo); color:#fff; border-radius:8px; padding:1px 6px; font-weight:700; }

  .top { background:var(--panel); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 22px; gap:14px; }
  .top h1 { font-size:16px; font-weight:700; }
  .top .sub { font-size:11px; color:var(--muted); }
  .top .spacer { flex:1; }
  .top .health { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); }
  .top .dot { width:9px; height:9px; border-radius:50%; background:var(--green); box-shadow:0 0 0 4px rgba(16,185,129,.15); }

  /* MAIN: 2 columnas */
  .main { overflow:hidden; display:grid; grid-template-columns:1fr 360px; }
  .col-left { overflow-y:auto; padding:22px; }
  .col-right { overflow-y:auto; padding:18px; background:var(--panel); border-left:1px solid var(--border); }

  /* Panel de asistente */
  .asistente { position:sticky; top:0; }
  .asistente .cabeza { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .asistente .cabeza .av { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--violet),var(--sky));
    display:flex; align-items:center; justify-content:center; font-size:18px; }
  .asistente .cabeza b { font-size:14px; }
  .asistente .cabeza .s { font-size:11px; color:var(--green); }
  .insight { background:var(--panel2); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:10px; }
  .insight .t { font-weight:700; font-size:13px; margin-bottom:6px; }
  .insight .tx { font-size:12px; color:var(--muted); line-height:1.5; margin-bottom:8px; }
  .insight .ac { font-size:12px; color:var(--indigo); border-top:1px solid var(--border); padding-top:8px; }
  .insight .ac b { color:var(--text); }
  .prioridad { display:inline-block; padding:2px 8px; border-radius:8px; font-size:10px; font-weight:700; margin-left:6px; }
  .pr-alta { background:rgba(239,68,68,.18); color:var(--red); }
  .pr-media { background:rgba(245,158,11,.18); color:var(--amber); }
  .pr-baja { background:rgba(16,185,129,.18); color:var(--green); }

  .funnel-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:10px; margin-bottom:20px; }
  .f { text-align:center; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px 10px; }
  .f .v { font-size:26px; font-weight:800; }
  .f .l { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-top:4px; }
  .f.f0 { background:linear-gradient(135deg,var(--indigo),var(--sky)); border:none; }
  .f.f0 .l { color:rgba(255,255,255,.85); }
  @media (max-width:1100px){ .funnel-grid{ grid-template-columns:repeat(4,1fr); } }

  .panel { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:16px; }
  .panel h3 { font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-bottom:14px; font-weight:700; }

  .bar-row { display:flex; align-items:center; gap:12px; margin-bottom:9px; }
  .bar-label { width:120px; font-size:12px; text-transform:capitalize; flex-shrink:0; }
  .bar { flex:1; height:18px; background:#0c0f16; border-radius:8px; overflow:hidden; }
  .bar>div { height:100%; background:linear-gradient(90deg,var(--indigo),var(--sky)); border-radius:8px; }
  .bar-num { width:34px; text-align:right; font-size:12px; font-weight:700; color:var(--muted); }

  .search { width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text); padding:11px 15px; border-radius:10px; font-size:13px; }
  .search:focus { outline:none; border-color:var(--indigo); }

  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; min-width:720px; }
  th,td { text-align:left; padding:11px 12px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.05em; position:sticky; top:0; background:var(--panel); z-index:2; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:var(--panel2); }
  .c-name { font-weight:600; }
  .tag { display:inline-block; background:var(--panel2); color:var(--muted); padding:2px 8px; border-radius:6px; font-size:11px; }
  .score { display:inline-block; background:rgba(99,102,241,.2); color:var(--indigo); font-weight:700; padding:1px 8px; border-radius:6px; font-size:11px; }
  .etapa { display:inline-block; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600; }
  .et-prospecto{background:rgba(99,102,241,.15);color:var(--indigo)} .et-contacto{background:rgba(14,165,233,.15);color:var(--sky)}
  .et-respondio{background:rgba(139,92,246,.15);color:var(--violet)} .et-demo{background:rgba(34,211,238,.15);color:var(--cyan)}
  .et-propuesta{background:rgba(245,158,11,.15);color:var(--amber)} .et-contrato,.et-ganado{background:rgba(16,185,129,.15);color:var(--green)}
  .et-perdido{background:rgba(239,68,68,.15);color:var(--red)}
  .next { font-size:11px; color:var(--muted); }

  /* Flujo visual del prospecto (mini-pipeline) */
  .mini-flow { display:flex; gap:2px; }
  .mini-flow .seg { height:6px; flex:1; border-radius:3px; background:var(--border); }
  .mini-flow .seg.on { background:var(--indigo); }
  .mini-flow .seg.done { background:var(--green); }

  .agent { display:flex; align-items:center; gap:14px; padding:14px; border:1px solid var(--border); border-radius:12px; background:var(--panel2); cursor:pointer; margin-bottom:9px; }
  .agent:hover { border-color:var(--indigo); }
  .agent .aname { font-weight:600; font-size:13px; }
  .agent .meta { font-size:11px; color:var(--muted); margin-top:2px; }
  .pill { padding:3px 11px; border-radius:12px; font-size:11px; font-weight:600; }
  .p-ok { background:rgba(16,185,129,.15); color:var(--green); }
  .p-err { background:rgba(239,68,68,.15); color:var(--red); }

  .empty { color:var(--muted); font-size:13px; padding:24px; text-align:center; }

  /* Grid de landings */
  .landing-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:12px; }
  .landing-card { border:1px solid var(--border); border-radius:12px; background:var(--panel2); cursor:pointer; overflow:hidden; transition:.15s; }
  .landing-card:hover { border-color:var(--indigo); transform:translateY(-2px); }
  .landing-card .thumb { height:90px; display:flex; align-items:center; justify-content:center; }
  .landing-card .lg-body { padding:12px 14px; }
  .landing-card .lg-nombre { font-weight:700; font-size:13px; line-height:1.3; margin-bottom:4px; }
  .landing-card .lg-meta { font-size:11px; color:var(--muted); line-height:1.5; }
  .landing-card .lg-acciones { padding:0 14px 12px; }
  .preview-tag { font-size:10px; color:var(--indigo); font-weight:600; border:1px solid var(--indigo); padding:2px 8px; border-radius:8px; }

  /* Chat del asistente */
  .chat-box { border-top:1px solid var(--border); margin-top:14px; padding-top:14px; }
  .chat-log { max-height:240px; overflow-y:auto; margin-bottom:10px; display:flex; flex-direction:column; gap:8px; }
  .chat-b { padding:9px 12px; border-radius:10px; font-size:12px; line-height:1.5; max-width:90%; }
  .chat-user { background:var(--indigo); color:#fff; align-self:flex-end; }
  .chat-ai { background:var(--panel2); border:1px solid var(--border); align-self:flex-start; }
  .chat-input-row { display:flex; gap:8px; }
  .chat-input-row input { flex:1; background:var(--panel2); border:1px solid var(--border); color:var(--text); padding:9px 12px; border-radius:9px; font-size:12px; }
  .chat-input-row button { background:var(--indigo); color:#fff; border:none; border-radius:9px; padding:0 14px; cursor:pointer; font-weight:600; }
  .action-btn { display:block; width:100%; text-align:left; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    padding:10px 12px; border-radius:9px; font-size:12px; cursor:pointer; margin-bottom:7px; transition:.15s; }
  .action-btn:hover { border-color:var(--indigo); background:#1d2330; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--border);
    padding:10px 18px; border-radius:10px; font-size:12px; z-index:100; box-shadow:0 6px 20px rgba(0,0,0,.4); }

  /* ==== REDISEÑO v2 ==== */
  /* KPIs con sparkline */
  .kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
  .kpi { background:var(--panel); border:1px solid var(--border); border-radius:13px; padding:16px; }
  .kpi.k0 { background:linear-gradient(135deg,var(--indigo),var(--sky)); border:none; }
  .kpi .num { font-size:27px; font-weight:800; line-height:1; }
  .kpi .lbl { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:6px; }
  .kpi.k0 .lbl { color:rgba(255,255,255,.85); }
  .spark { height:26px; margin-top:12px; display:flex; align-items:flex-end; gap:3px; }
  .spark i { flex:1; background:linear-gradient(180deg,var(--indigo),var(--sky)); border-radius:3px 3px 0 0; min-height:3px; }
  .kpi.k0 .spark i { background:rgba(255,255,255,.35); }

  /* Landings en 2 columnas (detalle) */
  .lg-detail { display:grid; grid-template-columns:340px 1fr; gap:16px; }
  .lg-info { padding:2px; }
  .lg-info .kv { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); font-size:12.5px; }
  .lg-info .kv .k { color:var(--muted); flex-shrink:0; }
  .lg-info .kv .v { font-weight:600; text-align:right; }
  .lg-preview { background:#fff; border:1px solid var(--border); border-radius:12px; overflow:hidden; height:calc(100vh - 180px); min-height:420px; }
  .lg-preview iframe { width:100%; height:100%; border:0; }

  /* Agentes con output */
  .agent { align-items:flex-start; }
  .agent .aicon { width:36px; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .agent .prod { font-size:11px; color:var(--muted); margin-top:3px; line-height:1.4; }
  .agent .out { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .out-chip { font-size:10px; background:#0c0f16; border:1px solid var(--border); border-radius:8px; padding:3px 8px; color:var(--sky); }

  /* Responsive: sidebar -> barra inferior en móvil */
  @media (max-width:900px){
    #app { grid-template-columns:1fr; grid-template-rows:56px 1fr auto; }
    .side { grid-row:3/4; grid-column:1/2; display:flex; align-items:center; padding:6px 8px;
      border-right:none; border-top:1px solid var(--border); overflow-x:auto; overflow-y:hidden;
      position:fixed; bottom:0; left:0; right:0; height:58px; z-index:40; background:var(--panel); }
    .side .logo { display:none; }
    .nav { flex-direction:row; gap:6px; width:max-content; min-width:100%; }
    .nav button { flex-direction:column; gap:3px; padding:6px 10px; font-size:10px; text-align:center; min-width:56px; border-left:none; }
    .nav button.on { border-left:none; border-top:2px solid var(--indigo); padding-left:10px; }
    .nav button .n { position:relative; top:0; right:0; }
    .main { grid-template-columns:1fr; }
    .col-right { display:none; }
    .col-left { padding-bottom:74px; }
    .lg-detail { grid-template-columns:1fr; }
    .lg-preview { height:380px; min-height:0; }
    .kpi-grid { grid-template-columns:repeat(2,1fr); }
    /* drawer a pantalla completa en móvil, dejando la barra inferior visible debajo */
        #drawer { inset:56px 0 58px 0 !important; }
  }
</style>
</head>

ation.md.\n\nRastrea los avances más recientes en IA generativa, herramientas de agentes/automatización y capacidades nuevas para servicios de marketing (video IA, ads, UGC, avatares, edición). Usa web_search y web_extract para datos frescos. Clasifica por utilidad para AplicatiBox (alta/media/baja) y esfuerzo de adopción.\n\nAl terminar, registra:\n`python \"C:\\Users\\Usuario\\AppData\\Local\\hermes\\agency\\scripts\\metrics.py\" record --agent innovation --type research --status ok --metric 4 --note \"Radar avances IA\"`\n\nEntrega en español un radar: 🔺 adoptar ya, 🟡 vigilar, ⚪ observar, y una propuesta concreta de ventaja comercial para esta semana.\n\n## Response\n\n# 💡 Innovation — Radar de Avances IA · Sept 10, 2026\n\n(**Nota:** `web_extract` no pudo traer texto completo (backend ddgs solo busca), así que trabajé con datos frescos de los snippets de búsqueda — suficientes y verificables. No hay señales inventadas.)\n\n## 🔺 Adoptar ya (utilidad alta / esfuerzo bajo)\n\n**1. AI UGC con avatares (HeyGen Avatar V + clones de 15 seg) → servicio de ads de video**\nClonar a un \"spokesperson\" con un selfie de 15 segundos y localizarlo a 175+ idiomas vía API. Para clínicas estéticas/odontología: video de testimonio/presentadora en segundos, sin grabar. **Es el diferenciador anti-agencia clásica** — hoy casi nadie en Colombia lo ofrece como producto empaquetado.\n- *Esfuerzo: bajo* (supone una licencia ~$24/mes y una plantilla de script).\n\n**2. Kling 3.0 Omni / Seedance 2.5 → video multi-shot con diálogo para UGC \"real\"**\nKling lidera diálogo multi-shot (ideal para testimonios con conversación), Seedance 2.5 mejora realismo. Complemento directo del punto 1 para producir \"video social\" scroll-stopping.\n- *Esfuerzo: medio* (curva de prompt + costo por clip).\n\n**3. Automatización de ads (Madgicx / creador de creativos de Meta)**\nMeta empuja automatización total de creativo + targeting. Peligro Y oportunidad: si no incorporamos IA de ads ahora, el cliente \" function buildNav(){
  const crm=DATA.crm||{};
  const fl=DATA.freelance||{};
  const lg=DATA.landings||[];
  const items=[
    {k:'resumen', icn:'◈', lbl:'Resumen', n:null},
    {k:'prospectos', icn:'◉', lbl:'Prospectos', n:crm.total||0},
    {k:'agentes', icn:'⚙', lbl:'Agentes', n:Object.keys(DATA.agentes||{}).length},
    {k:'landings', icn:'🖼', lbl:'Landings', n:lg.length},
    {k:'freelance', icn:'💼', lbl:'Freelance', n:fl.total||0},
  ];
  $('#nav').innerHTML=items.map(it=>'<button data-k="'+it.k+'" class="'+(state.view===it.k?'on':'')+'" title="'+it.lbl+'"><span class="icn">'+it.icn+'</span><span class="lbl">'+it.lbl+'</span>'+(it.n!=null?'<span class="n">'+it.n+'</span>':'')+'</button>').join('');
  document.querySelectorAll('#nav button').forEach(b=>{ b.onclick=()=>{ state.view=b.dataset.k; closeDrawer(); render(); }; });
}

const TITLES={resumen:'Resumen', prospectos:'Prospectos', agentes:'Agentes', landings:'Landings', freelance:'Freelance'};

function render(){
  buildNav();
  $('#pageTitle').textContent=TITLES[state.view]||'Resumen';
  $('#generated').textContent='actualizado: '+(DATA.generated_at||'').slice(0,16).replace('T',' ');
  // Columna izquierda según vista
  const L=$('#colLeft');
  if(state.view==='resumen') L.innerHTML=vResumen();
  else if(state.view==='prospectos') L.innerHTML=vProspectos();
  else if(state.view==='landings') L.innerHTML=vLandings();
  else if(state.view==='freelance') L.innerHTML=vFreelance();
  else L.innerHTML=vAgentes();
  // Columna derecha = asistente SIEMPRE
  $('#colRight').innerHTML=vAsistente();
}

function calcularPostulacion(bmin, bmax, kw){
  const min=bmin||0, max=bmax||min||0;
  let precio=0;
  if(max>0){
    precio=Math.max(min, Math.round(max*0.55/10)*10);
    if(min>0 && min>max*0.3) precio=min;
  } else {
    precio=450;
  }
  if(precio<150) precio=250;

  let plazo=7;
  if(/shopify|woocommerce|ecommerce|tienda|wordpress|web|landing|diseño|sitio|página/.test(kw)) plazo=10;
  else if(/automat|n8n|zapier|integration|workflow|bot|sistema/.test(kw)) plazo=8;
  else if(/retell|vapi|voice|agente|chatbot|asistente/.test(kw)) plazo=7;
  else plazo=7;

  let hitos=[];
  if(/shopify|woocommerce|ecommerce|tienda/.test(kw)){
    hitos=[['Configuración de tienda + diseño', Math.round(precio*0.3)],['Carga de catálogo + pasarela de pago', Math.round(precio*0.4)],['Optimización + lanzamiento', Math.round(precio*0.3)]];
  } else if(/automat|n8n|zapier|integration|workflow|bot/.test(kw)){
    hitos=[['Análisis de procesos + arquitectura', Math.round(precio*0.3)],['Implementación de flujos automatizados', Math.round(precio*0.4)],['Pruebas + puesta en producción', Math.round(precio*0.3)]];
  } else if(/video|audiovisual|edición/.test(kw)){
    hitos=[['Guión y aprobación', Math.round(precio*0.3)],['Producción y edición', Math.round(precio*0.5)],['Revisión final y entrega', Math.round(precio*0.2)]];
  } else {
    hitos=[['Propuesta detallada + diseño inicial', Math.round(precio*0.3)],['Desarrollo e implementación', Math.round(precio*0.4)],['Ajustes finales + entrega', Math.round(precio*0.3)]];
  }
  const hitosHTML=hitos.map(function(h,i){ return '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)"><span>'+ (i+1)+'. '+esc(h[0])+'</span><span style="font-weight:600;color:var(--sky)">$'+h[1]+'</span></div>'; }).join('');
  const textoCopiar='Precio: $'+precio+'\nPlazo: '+plazo+' días\nHitos:\n'+hitos.map(function(h,i){ return '  '+(i+1)+'. '+h[0]+' — $'+h[1]; }).join('\n');
  return {precio:'$'+precio, plazo:plazo, hitos:hitos, hitosHTML:hitosHTML, textoCopiar:textoCopiar};
}

function copiar(texto){
  // copia robusta: prueba navigator.clipboard, y si falla (HTTP/iframe/móvil),
  // usa un textarea temporal + execCommand como fallback
  function fallback(t){
    const ta=document.createElement('textarea');
    ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    let ok=false;
    try{ ok=document.execCommand('copy'); }catch(e){ ok=false; }
    document.body.removeChild(ta);
    return ok;
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(()=>toast('✓ Copiado al portapapeles')).catch(()=>{
      const ok=fallback(texto); toast(ok?'✓ Copiado':'No se pudo copiar, seleccioná manualmente');
    });
  } else {
    const ok=fallback(texto); toast(ok?'✓ Copiado':'No se pudo copiar, seleccioná manualmente');
  }
}

function genPropuestaIA(fl_id){
  const ops=(DATA.freelance||{}).oportunidades||[];
  const o=ops.find(x=>String(x.fl_id)===String(fl_id));
  if(!o){ toast('Oportunidad no encontrada'); return; }
  const area=document.getElementById('propArea');
  const chars=document.getElementById('propChars');
  if(area){ area.textContent='⏳ Generando propuesta con IA…'; area.style.color='var(--muted)'; }
  apiCall('/api/propuesta', {titulo:o.titulo||'', preview:o.preview||'', keywords:o.keywords_hit||''}).then(d=>{
    if(d.ok && d.propuesta){
      if(area){ area.textContent=d.propuesta; area.style.color=''; }
      if(chars){ chars.textContent=d.chars+ (d.chars>=1500?' caracteres (recortada)':' caracteres'); }
      // actualizar el botón de copiar para usar la nueva propuesta
      toast('✓ Propuesta IA generada');
    } else {
      if(area){ area.textContent='⚠ No se pudo generar con IA: '+(d.error||'sin conexión al servidor'); }
      toast('⚠ '+(d.error||'sin conexión al servidor'));
    }
  });
}

function postularFreelancer(fl_id, textoCampos, plazo){
  const ops=(DATA.freelance||{}).oportunidades||[];
  const o=ops.find(x=>String(x.fl_id)===String(fl_id));
  if(!o){ toast('Oportunidad no encontrada'); return; }
  const confirmado = confirm('Enviar bid REAL a Freelancer para "'+(o.titulo||'')+'"?\n\nEsto postula formalmente en tu cuenta Pipebay. Es irreversible.');
  if(!confirmado){ toast('Cancelado. No se envió nada.'); return; }
  const btn=document.getElementById('btnPostular');
  if(btn){ btn.textContent='⏳ Enviando bid…'; btn.disabled=true; }
  let amount=o.presupuesto_min||0;
  const m=(textoCampos||'').match(/Precio:\s*\$?(\d+)/);
  if(m) amount=parseInt(m[1]);
  let period=plazo||7;
  const m2=(textoCampos||'').match(/Plazo:\s*(\d+)/);
  if(m2) period=parseInt(m2[1]);
  const area=document.getElementById('propArea');
  const description = (area && area.textContent && area.textContent.indexOf('generando')<0 && area.textContent.indexOf('no se pudo')<0 && area.textContent.trim()) ? area.textContent.trim() : 'Propuesta de AplicatiBox para tu proyecto. Ver portafolio: https://aplicatibox.com/es3/portafolio/';
  apiCall('/api/postular', {project_id:o.fl_id, amount:amount, period:period, description:description, real:true}).then(function(d){
    if(d.ok && !d.dry_run){
      toast('✅ Bid enviado a Freelancer');
      if(btn){ btn.textContent='✅ Enviado'; btn.disabled=false; }
    } else if(d.ok && d.dry_run){
      toast('(dry-run) validado, no enviado');
    } else {
      toast('⚠ '+(d.error||'error al enviar'));
      if(btn){ btn.textContent='🚀 Reintentar'; btn.disabled=false; }
    }
  });
}

/* ==== Conexión al servidor de control (acciones en vivo) ==== */
const API = 'http://127.0.0.1:8123';
let chatHist = [];

function apiCall(path, body){
  return fetch(API+path, {
    method: body ? 'POST' : 'GET',
    headers: body ? {'Content-Type':'application/json'} : {},
    body: body ? JSON.stringify(body) : undefined,
  }).then(r => r.json()).catch(err => ({ok:false, error:'sin conexión al servidor: '+err.message}));
}

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 3500);
}

function checkConn(){
  apiCall('/health').then(d=>{
    const s=document.getElementById('connStatus');
    if(s){ s.textContent = d.ok ? '● conectado' : '● sin conexión'; s.style.color = d.ok ? 'var(--green)' : 'var(--red)'; }
  });
}

function addChat(cls, text){
  const log=document.getElementById('chatLog');
  if(!log)return;
  const d=document.createElement('div'); d.className='chat-b '+cls; d.textContent=text;
  log.appendChild(d); log.scrollTop=log.scrollHeight;
}

function chatSend(){
  const inp=document.getElementById('chatInput'); if(!inp||!inp.value.trim())return;
  const msg=inp.value.trim(); inp.value='';
  addChat('chat-user', msg);
  apiCall('/api/chat', {message:msg}).then(d=>{
    if(d.ok) addChat('chat-ai', d.reply);
    else addChat('chat-ai', '⚠ '+((d.error)||'no pude procesar'));
  });
}

function accionSendTest(){
  // Envía mensaje al top prospecto (primer lead)
  const top = (DATA.crm && DATA.crm.leads && DATA.crm.leads[0]);
  if(!top){ toast('No hay prospectos'); return; }
  apiCall('/api/send', {nombre:top.nombre}).then(d=>{
    if(d.ok){ toast('✓ Mensaje enviado a '+d.nombre+' (marcado contacto)'); addChat('chat-ai','✓ '+d.msg); }
    else toast('⚠ '+((d.error)||'error'));
  });
}

function accionRefresh(){
  apiCall('/api/snapshot').then(d=>{
    if(d.total!=null){ toast('✓ Datos actualizados: '+d.total+' prospectos'); }
    else toast('⚠ sin conexión al servidor');
  });
}

render();
setTimeout(checkConn, 300);
