<script>
(function(){
  function val(sel){ var e=document.querySelector('[data-pencil-name="'+sel+'"] input'); return e?e.value.trim():''; }
  var formBox = document.querySelector('[data-pencil-name="FormBox"]');
  if(!formBox) return;
  // inyectar inputs reales dentro de los "input frames":
  var map=[['InputNombre','Escribe tu nombre','nombre'],['InputWa','Escribe tu WhatsApp','whatsapp'],['InputTrat','Microdiseño / Implantes / Armonización','tratamiento']];
  map.forEach(function(m){
    var frame=document.querySelector('[data-pencil-name="'+m[0]+'"]');
    if(!frame) return;
    var placeholder=frame.querySelector('div');
    var input=document.createElement('input');
    input.type='text'; input.name=m[2]; input.placeholder=m[1];
    input.style.cssText='background:transparent;border:none;outline:none;color:#F2EDE4;font-family:Manrope,sans-serif;font-size:14px;width:100%';
    if(placeholder){ placeholder.style.display='none'; }
    frame.appendChild(input);
  });
  var btn=document.querySelector('[a-wa-submit]');
  var submitFrame=document.querySelector('[data-pencil-name="SubmitBtn"]');
  if(submitFrame){
    submitFrame.style.cursor='pointer';
    submitFrame.addEventListener('click',function(){
      var n=val('InputNombre'), w=val('InputWa'), t=val('InputTrat');
      if(!n||!w){ alert('Escribe tu nombre y WhatsApp para agendar 🙂'); return; }
      var msg='Hola Harmoniza, soy '+n+'. Quiero agendar valoración'+(t?' para '+t:'')+'. Mi WhatsApp: '+w;
      window.open('https://wa.me/573135079828?text='+encodeURIComponent(msg),'_blank');
    });
  }
})();
</script>
<script>
(function(){
  var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var els = document.querySelectorAll('[data-pencil-name]');
  if (!rm) {
    els.forEach(function(e){
      e.style.opacity='0'; e.style.transform='translateY(18px)';
      e.style.transition='opacity .7s cubic-bezier(0.32,0.72,0,1), transform .7s cubic-bezier(0.32,0.72,0,1)';
    });
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.isIntersecting) { en.target.style.opacity='1'; en.target.style.transform='translateY(0)'; io.unobserve(en.target); }
      });
    }, {threshold:0.1});
    els.forEach(function(e){ io.observe(e); });
  }
  document.querySelectorAll('a[href*="wa.me"], [data-pencil-name="SubmitBtn"], [data-pencil-name="CTA"]').forEach(function(b){
    b.style.transition='transform .3s cubic-bezier(0.32,0.72,0,1)';
    b.addEventListener('mouseenter', function(){ b.style.transform='scale(1.03)'; });
    b.addEventListener('mousedown', function(){ b.style.transform='scale(0.97)'; });
    b.addEventListener('mouseleave', function(){ b.style.transform='scale(1)'; });
  });
})();
</script></body>
